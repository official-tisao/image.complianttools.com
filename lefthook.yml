pre-commit:
  parallel: false
  commands:
    lint:
      glob: '*.{js,mjs,ts,svelte}'
      run: pnpm exec eslint {staged_files}
    format:
      glob: '*.{js,mjs,ts,svelte,json,yaml,yml,md,css}'
      run: pnpm exec prettier --check {staged_files}

commit-msg:
  commands:
    commitlint:
      run: node scripts/commitlint.mjs {1}
