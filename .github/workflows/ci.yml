name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify dependency licences
        run: pnpm verify:licenses

      - name: Verify static assets
        run: pnpm verify:assets

      - name: Verify trademark substitutions
        run: pnpm verify:trademarks

      - name: Verify WASM asset integrity
        run: pnpm verify:wasm

      - name: Verify README and plan synchronization
        id: plan-sync
        run: pnpm verify:plan-sync

      - name: Record plan-sync exemption on the pull request
        if: github.event_name == 'pull_request' && steps.plan-sync.outputs.plan_exempt_used == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ `[plan-exempt]` was used: `README.md` changed without `PLAN.md` in this pull request.'
            })

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test && pnpm test:gates

      - name: Build
        run: pnpm build

      - name: Enforce absolute metadata-read latency budget
        run: pnpm --filter @complianttools/image-engine bench

      - name: Verify every shipped route budget
        run: pnpm verify:route-budgets

      - name: Enforce artifact size limits
        run: pnpm size

  no-network:
    name: no-network
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:no-network

  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e

  lighthouse:
    name: lighthouse (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            urls: --url=http://127.0.0.1:4174/convert --url=http://127.0.0.1:4174/compress --url=http://127.0.0.1:4174/resize --url=http://127.0.0.1:4174/heic-converter --url=http://127.0.0.1:4174/raw-converter
          - group: modern-formats
            urls: --url=http://127.0.0.1:4174/avif-converter --url=http://127.0.0.1:4174/webp-converter --url=http://127.0.0.1:4174/jxl-converter --url=http://127.0.0.1:4174/svg-to-png --url=http://127.0.0.1:4174/image-to-svg
          - group: document-and-export
            urls: --url=http://127.0.0.1:4174/pdf-to-image --url=http://127.0.0.1:4174/image-to-pdf --url=http://127.0.0.1:4174/favicon-generator --url=http://127.0.0.1:4174/gif-converter --url=http://127.0.0.1:4174/embedded-converter
          - group: data-and-metadata
            urls: --url=http://127.0.0.1:4174/base64-image --url=http://127.0.0.1:4174/cbz-converter --url=http://127.0.0.1:4174/exif-viewer --url=http://127.0.0.1:4174/remove-exif --url=http://127.0.0.1:4174/image-info
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Collect three fresh-browser measurements per route
        run: pnpm exec lhci collect ${{ matrix.urls }} --numberOfRuns=3
      - name: Enforce Lighthouse thresholds
        run: pnpm exec lhci assert

  embedded-compile:
    name: embedded-compile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lvgl/lvgl
          ref: 4495f428630cc1741bd8bfd977f080e8460e8e8d
          path: .lvgl/v8
      - uses: actions/checkout@v4
        with:
          repository: lvgl/lvgl
          ref: 85aa60d18b3d5e5588d7b247abf90198f07c8a63
          path: .lvgl/v9
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @complianttools/image-engine build
      - run: node scripts/write-embedded-compile-fixtures.mjs .generated/lvgl
      - name: Compile generated sources against real LVGL v8 and v9
        run: |
          cc -std=c11 -Wall -Wextra -Werror -DLV_CONF_SKIP -I .lvgl/v8 -c .generated/lvgl/lvgl-v8.c -o .generated/lvgl/lvgl-v8.o
          cc -std=c11 -Wall -Wextra -Werror -DLV_CONF_SKIP -I .lvgl/v9 -c .generated/lvgl/lvgl-v9.c -o .generated/lvgl/lvgl-v9.o
      - uses: arduino/setup-arduino-cli@v2
      - name: Install pinned Arduino targets and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.6
          arduino-cli core install esp32:esp32@3.3.8
          arduino-cli lib install "Adafruit GFX Library@1.12.6"
          arduino-cli lib install "TFT_eSPI@2.5.43"
      - name: Compile generated Adafruit GFX and TFT_eSPI sketches
        run: |
          arduino-cli compile --fqbn arduino:avr:uno .generated/lvgl/adafruit
          arduino-cli compile --fqbn esp32:esp32:esp32 .generated/lvgl/tft-espi

  raw-corpus:
    name: raw-corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache hash-pinned CC0 RAW corpus
        uses: actions/cache@v4
        with:
          path: .cache/raw-corpus
          key: raw-corpus-${{ hashFiles('packages/engine/test/fixtures/raw-real-corpus.json') }}
      - run: pnpm verify:raw-corpus

  credential-leak:
    name: credential-leak
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:credential-leak

  docker-validate:
    name: docker-validate
    # Build the production image from the Dockerfile, prove the container
    # starts cleanly, that nginx serves the static site, and that
    # `docker compose up` reaches a healthy state. This is the guard that
    # catches a broken Dockerfile or a malformed nginx.conf before it
    # ever leaves CI.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The web app's `build` script runs Vite directly (not through Turbo),
      # so the `^build` dependency on @complianttools/image-engine never
      # fires. Build the engine first so `dist/` exists for the SSR bundle
      # to resolve.
      - name: Build the engine package
        run: pnpm --filter @complianttools/image-engine build

      - name: Build the static site
        run: pnpm --filter @complianttools/web build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: ctimg-web:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show image size
        run: docker images ctimg-web:ci --format "{{.Repository}}:{{.Tag}} {{.Size}}"

      - name: Boot the container and probe it
        id: boot
        run: |
          set -euo pipefail
          # Start the container in the background, mapping 8080 -> 80.
          docker run -d --name ctimg-web-ci -p 8080:80 ctimg-web:ci
          # Wait for the healthcheck to report healthy, up to 30s.
          for _ in $(seq 1 30); do
            status="$(docker inspect --format='{{.State.Health.Status}}' ctimg-web-ci || true)"
            if [ "$status" = "healthy" ]; then break; fi
            sleep 1
          done
          echo "container_status=$(docker inspect --format='{{.State.Status}}' ctimg-web-ci)"
          echo "health_status=$status"
          # HTTP probe.
          code="$(curl -sS -o /tmp/index.html -w '%{http_code}' http://127.0.0.1:8080/)"
          echo "http_code=$code"
          echo "body_bytes=$(wc -c < /tmp/index.html)"
          # Must be a 200 and the served HTML must reference the SvelteKit shell.
          if [ "$code" != "200" ]; then
            echo "::error::Expected HTTP 200 from /, got $code"
            docker logs ctimg-web-ci || true
            exit 1
          fi
          if ! grep -q 'svelte' /tmp/index.html; then
            echo "::error::Index HTML does not look like a SvelteKit page"
            exit 1
          fi
          # COOP/COEP must be present — the engine's crossOriginIsolated
          # probe depends on them.
          coop="$(curl -sSI http://127.0.0.1:8080/ | grep -i '^cross-origin-opener-policy:' | tr -d '\r' || true)"
          coep="$(curl -sSI http://127.0.0.1:8080/ | grep -i '^cross-origin-embedder-policy:' | tr -d '\r' || true)"
          echo "COOP header: $coop"
          echo "COEP header: $coep"
          if [ -z "$coop" ] || [ -z "$coep" ]; then
            echo "::error::Missing COOP/COEP headers required by the engine"
            exit 1
          fi
          # Two concurrent requests must both succeed.
          curl -sS -o /dev/null -w 'req1=%{http_code} time=%{time_total}\n' http://127.0.0.1:8080/ &
          curl -sS -o /dev/null -w 'req2=%{http_code} time=%{time_total}\n' http://127.0.0.1:8080/ &
          wait

      - name: Dump logs on failure
        if: failure()
        run: |
          docker logs ctimg-web-ci || true
          docker inspect ctimg-web-ci || true

      - name: Tear down the container
        if: always()
        run: |
          docker rm -f ctimg-web-ci || true

      - name: Validate docker-compose
        env:
          HOST_PORT: 18080
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose config -q
          docker compose up -d
          for _ in $(seq 1 30); do
            status="$(docker inspect --format='{{.State.Health.Status}}' ctimg-web || true)"
            if [ "$status" = "healthy" ]; then break; fi
            sleep 1
          done
          code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/)"
          echo "compose_http_code=$code"
          if [ "$code" != "200" ]; then
            echo "::error::compose: expected HTTP 200 from /, got $code"
            docker compose logs --no-color || true
            exit 1
          fi

      - name: Tear down compose
        if: always()
        run: |
          docker compose down --remove-orphans || true
