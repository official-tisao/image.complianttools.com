# Lean single-service compose file. Serves the static SvelteKit build
# behind nginx:alpine. Restarts unless you stop it. Caps at 1 CPU and
# 128 MB of RAM, sized for 2 concurrent requests.

services:
  web:
    image: ctimg-web:local
    build:
      context: .
      dockerfile: Dockerfile
      tags:
        - ctimg-web:${TAG:-local}
    container_name: ctimg-web
    restart: unless-stopped
    init: true
    ports:
      - '${HOST_PORT:-8080}:80'
    environment:
      # Read by anything in the container that wants to know the public URL.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      TZ: ${TZ:-UTC}
    # Cap to the smallest footprint that still serves 2 concurrent requests.
    # nginx:alpine idle RAM is ~5-10 MB; a 128 MB ceiling leaves headroom for
    # worker connections, gzip buffers, and the wasm asset range requests.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 32M
    # Belt-and-braces: even on engines that ignore deploy.resources,
    # these sysctls keep the container lean.
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    # Defence in depth — the image should already be minimal, but this stops
    # anything inside the container from escalating.
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:size=32M
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null 2>&1']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'

  githubci:
    image: ctimg-githubci:local
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile.githubci
    init: true
    stop_grace_period: 1m
    profiles: ['githubci']
    volumes:
      - .:/workspace:ro
      - ./.cache/githubci:/reports:rw
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    environment:
      GITHUBCI_IMAGE: ctimg-githubci:local
      GITHUBCI_PARALLEL: ${GITHUBCI_PARALLEL:-2}
      GITHUBCI_MEMORY: ${GITHUBCI_MEMORY:-3g}
      GITHUBCI_CPUS: ${GITHUBCI_CPUS:-2}
      GITHUBCI_BASE: ${GITHUBCI_BASE:-HEAD^}
    entrypoint: ['python3', '/opt/githubci/runner.py']
    command: ['test']

networks:
  default:
    name: ctimg
