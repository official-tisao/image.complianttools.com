user nginx;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # nginx:alpine ships /var/cache/nginx /var/log/nginx /var/run; we are
    # running as the unprivileged nginx user and those paths are root-owned,
    # so redirect every writable path into /tmp.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    keepalive_timeout 30;

    # Honour client Accept-Encoding. Precompressed .gz siblings are
    # produced by adapter-static and live next to each text asset.
    gzip on;
    gzip_static on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml;

    # brotli_static is not in stock nginx:alpine (it lives in
    # nginx-mod-http-brotli). The build does produce .br siblings, but
    # serving them needs a custom build of nginx. Leave brotli off here;
    # clients that don't accept gzip will fall back to uncompressed.
    # brotli_static on;
    # brotli_types
    #     text/plain
    #     text/css
    #     text/javascript
    #     application/javascript
    #     application/json
    #     application/wasm
    #     image/svg+xml;

    # Long cache for hashed / immutable assets. Everything else is fresh on
    # every request so a deploy is the source of truth.
    map $uri $cache_control {
        default                          "public, max-age=0, must-revalidate";
        ~*^/_app/immutable/.*             "public, max-age=31536000, immutable";
        ~*^/wasm/.*                      "public, max-age=31536000, immutable";
        ~*^/models/.*                    "public, max-age=31536000, immutable";
        ~*^/fonts/.*                     "public, max-age=31536000, immutable";
    }

    # All response headers (security + caching) live in one place. nginx
    # drops server-level `add_header` directives the moment any location
    # defines its own, so we keep a single comprehensive set per location.
    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        autoindex off;

        # Default route — the prerendered static site, with HTML5 history
        # fallback so client-side routes resolve to the right page.
        location / {
            add_header Cross-Origin-Opener-Policy   "same-origin"      always;
            add_header Cross-Origin-Embedder-Policy "require-corp"     always;
            add_header Cross-Origin-Resource-Policy "same-origin"      always;
            add_header Referrer-Policy              "no-referrer"      always;
            add_header X-Content-Type-Options       "nosniff"          always;
            add_header X-Frame-Options              "DENY"             always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=(), browsing-topics=()" always;
            add_header Strict-Transport-Security    "max-age=63072000; includeSubDomains; preload" always;
            add_header Cache-Control                $cache_control     always;
            # adapter-static emits `<name>.html` for every page; SvelteKit
            # also creates a `<name>/` directory of sub-pages (e.g. `convert/png-to-webp`).
            # Prefer the .html sibling first, then the directory's index, then root.
            try_files $uri.html $uri/index.html $uri =404;
        }

        # Long-cached hashed assets (SvelteKit /_app/immutable/*).
        location ~* ^/_app/immutable/ {
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
            access_log off;
        }

        # Long-cached lazy-loaded codec/model/font assets.
        location ~* ^/(wasm|models|fonts)/ {
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
            access_log off;
        }

        # Service worker must never be cached aggressively.
        location = /sw.js {
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
            try_files $uri =404;
        }

        # Hide any dotfiles (defence in depth — they shouldn't be in the build).
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }

        location = /robots.txt { try_files $uri =404; }
        location = /sitemap.xml { try_files $uri =404; }
    }
}
